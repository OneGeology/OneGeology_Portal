name: oneg

services:

  maven:
    image: 'maven:3-eclipse-temurin-21-alpine'
    container_name: 'oneg-maven'
    working_dir: /usr/src/mymaven
    command: 'mvn clean spring-boot:run -DskipTests'
    ports:
      - '8080:8080'
    volumes:
      - '${HOME}/.m2:/root/.m2'
      - '.:/usr/src/mymaven'
    networks:
      - oneg

networks:
  oneg:
